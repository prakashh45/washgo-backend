spring.application.name=catalog-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/washgo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:washgo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
