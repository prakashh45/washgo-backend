name: WashGo Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: prakashh45

jobs:
  test-and-build:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build and Run Unit Tests
        run: ./gradlew clean build --no-daemon

  build-and-push-images:
    name: Build & Push Docker Images
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - config-server
          - discovery-server
          - api-gateway
          - auth-service
          - catalog-service
          - order-service
          - payment-service
          - logistics-service
          - notification-service

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/prakashh45/${{ matrix.service }}:latest
            ghcr.io/prakashh45/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 20m

          script: |
            set -euxo pipefail

            echo "========== CONNECTED =========="
            whoami
            hostname
            pwd

            cd /home/ec2-user/washgo-backend/infrastructure

            echo "========== DOCKER =========="
            docker --version
            docker compose version

            echo "========== LOGIN GHCR =========="
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u "${{ secrets.GHCR_USERNAME }}" \
            --password-stdin

            echo "========== PULL IMAGES =========="
            docker compose pull

            echo "========== START CONTAINERS =========="
            docker compose up -d --remove-orphans

            echo "========== CLEANUP =========="
            docker image prune -af

            echo "========== RUNNING CONTAINERS =========="
            docker ps

            echo "========== DEPLOYMENT COMPLETE =========="