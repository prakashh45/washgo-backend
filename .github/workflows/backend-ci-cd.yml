name: WashGo Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: prakashh45

jobs:
  test-and-build:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Restore Firebase Credentials (api-gateway)
        run: |
          mkdir -p api-gateway/src/main/resources
          echo "${{ secrets.API_GATEWAY_FIREBASE_B64 }}" | base64 -d > api-gateway/src/main/resources/firebase-service-account.json

      - name: Restore Firebase Credentials (auth-service)
        run: |
          mkdir -p auth-service/src/main/resources/firebase
          echo "${{ secrets.AUTH_SERVICE_FIREBASE_B64 }}" | base64 -d > auth-service/src/main/resources/firebase/serviceAccountKey.json

      - name: Build and Run Unit Tests
        run: ./gradlew clean build --no-daemon

  build-and-push-images:
    name: Build & Push Docker Images
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - config-server
          - discovery-server
          - api-gateway
          - auth-service
          - catalog-service
          - order-service
          - payment-service
          - logistics-service
          - notification-service

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Firebase Credentials (api-gateway)
        if: matrix.service == 'api-gateway'
        run: |
          mkdir -p api-gateway/src/main/resources
          echo "${{ secrets.API_GATEWAY_FIREBASE_B64 }}" | base64 -d > api-gateway/src/main/resources/firebase-service-account.json

      - name: Restore Firebase Credentials (auth-service)
        if: matrix.service == 'auth-service'
        run: |
          mkdir -p auth-service/src/main/resources/firebase
          echo "${{ secrets.AUTH_SERVICE_FIREBASE_B64 }}" | base64 -d > auth-service/src/main/resources/firebase/serviceAccountKey.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/prakashh45/${{ matrix.service }}:latest
            ghcr.io/prakashh45/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2-1:
    name: Deploy EC2-1
    needs: build-and-push-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2-1
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 16.171.148.177
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /home/ec2-user/washgo-backend

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

            git fetch origin
            git reset --hard origin/main
            git clean -fd
            
            cat > .env <<'EOF'
               POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
                EC2_1_PRIVATE_IP=${{ secrets.EC2_1_PRIVATE_IP }}
                WASHGO_GATEWAY_SECRET=${{ secrets.WASHGO_GATEWAY_SECRET }}
                FIREBASE_CREDENTIALS_BASE64=${{ secrets.API_GATEWAY_FIREBASE_B64 }}
  
              RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
              RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
              RAZORPAY_CURRENCY=INR
              EOF

            docker compose -f docker-compose.ec2-1.yml pull
            docker compose -f docker-compose.ec2-1.yml down
            docker compose -f docker-compose.ec2-1.yml up -d

            docker image prune -af

            docker ps

  deploy-ec2-2:
    name: Deploy EC2-2
    needs: deploy-ec2-1
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2-2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 13.51.55.166
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /home/ec2-user/washgo-backend

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

            git fetch origin
            git reset --hard origin/main
            git clean -fd

            cat > .env <<'EOF'
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            EC2_1_PRIVATE_IP=${{ secrets.EC2_1_PRIVATE_IP }}
            WASHGO_GATEWAY_SECRET=${{ secrets.WASHGO_GATEWAY_SECRET }}
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            RAZORPAY_CURRENCY=INR
            EOF

            docker-compose -f docker-compose.ec2-2.yml pull
            docker-compose -f docker-compose.ec2-2.yml down
            docker-compose -f docker-compose.ec2-2.yml up -d

            docker image prune -af

            docker ps
