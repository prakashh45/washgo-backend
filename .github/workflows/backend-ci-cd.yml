name: WashGo Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: prakashh45

jobs:
  test-and-build:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build and Run Unit Tests
        run: ./gradlew clean build --no-daemon

  build-and-push-images:
    name: Build & Push Docker Images
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - config-server
          - discovery-server
          - api-gateway
          - auth-service
          - catalog-service
          - order-service
          - payment-service
          - logistics-service
          - notification-service

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/prakashh45/${{ matrix.service }}:latest
            ghcr.io/prakashh45/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2-1:
    name: Deploy EC2-1
    needs: build-and-push-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2-1
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 16.171.148.177
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            
            cd /home/ec2-user/washgo-backend
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin
            git fetch origin
             git reset --hard origin/main
              git clean -fd
            
            docker compose -f docker-compose.ec2-1.yml pull
            docker compose -f docker-compose.ec2-1.yml down
            docker compose -f docker-compose.ec2-1.yml up -d
            docker image prune -af
            
            docker ps
            

  deploy-ec2-2:
    name: Deploy EC2-2
    needs: deploy-ec2-1
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2-2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 13.51.55.166
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /home/ec2-user/washgo-backend

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

            git fetch origin
             git reset --hard origin/main
              git clean -fd
            cd /home/ec2-user/washgo-backend/infrastructure

           docker compose -f docker-compose.ec2-1.yml pull
           docker compose -f docker-compose.ec2-1.yml down
           docker compose -f docker-compose.ec2-1.yml up -d

            docker image prune -af

            docker ps