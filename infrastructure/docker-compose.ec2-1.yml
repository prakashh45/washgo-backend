version: "3.9"

services:
  postgres:
             image: postgres:16-alpine
             container_name: washgo-postgres
             restart: unless-stopped

             environment:
               POSTGRES_DB: washgo_db
               POSTGRES_USER: washgo
               POSTGRES_PASSWORD: root

             ports:
               - "5432:5432"

             volumes:
               - postgres-data:/var/lib/postgresql/data

             healthcheck:
               test: ["CMD-SHELL", "pg_isready -U washgo"]
               interval: 10s
               timeout: 5s
               retries: 10

             networks:
               - washgo-network
  kafka:
    image: apache/kafka:3.9.0
    container_name: washgo-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

    networks:
      - washgo-network


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: washgo-kafka-ui
    restart: unless-stopped

    ports:
      - "8089:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: WashGo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - washgo-network


  config-server:
    image: ghcr.io/prakashh45/config-server:latest
    container_name: washgo-config-server
    restart: unless-stopped

    ports:
      - "8888:8888"

    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    networks:
      - washgo-network

  discovery-server:
    image: ghcr.io/prakashh45/discovery-server:latest
    container_name: washgo-discovery-server
    restart: unless-stopped

    depends_on:
      config-server:
        condition: service_healthy

    ports:
      - "8761:8761"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 10

    networks:
      - washgo-network

  api-gateway:
    image: ghcr.io/prakashh45/api-gateway:latest
    container_name: washgo-api-gateway
    restart: unless-stopped

    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WASHGO_GATEWAY_SECRET: default-gateway-secret-key-12345

    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 10

    networks:
      - washgo-network

  auth-service:
    image: ghcr.io/prakashh45/auth-service:latest
    container_name: washgo-auth-service
    restart: unless-stopped

    ports:
      - "8081:8081"

    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/washgo_db
      SPRING_DATASOURCE_USERNAME: washgo
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    healthcheck:
      test: [ "CMD-SHELL","wget -qO- http://localhost:8081/actuator/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 10

    networks:
      - washgo-network


  catalog-service:
    image: ghcr.io/prakashh45/catalog-service:latest
    container_name: washgo-catalog-service
    restart: unless-stopped

    ports:
      - "8082:8082"

    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/washgo_db
      SPRING_DATASOURCE_USERNAME: washgo
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    healthcheck:
      test: [ "CMD-SHELL","wget -qO- http://localhost:8082/actuator/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 10

    networks:
      - washgo-network


networks:
  washgo-network:
    driver: bridge

volumes:
  postgres-data: