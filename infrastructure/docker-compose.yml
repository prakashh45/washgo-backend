version: "3.9"

services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================
  postgres:
    image: postgres:16-alpine
    container_name: washgo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: washgo_db
      POSTGRES_USER: washgo
      POSTGRES_PASSWORD: root

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U washgo"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - washgo-network

  # ==========================================================
  # Kafka
  # ==========================================================
  kafka:
    image: apache/kafka:3.9.0
    container_name: washgo-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

    networks:
      - washgo-network

  # ==========================================================
  # Kafka UI
  # ==========================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: washgo-kafka-ui
    restart: unless-stopped

    ports:
      - "8089:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: WashGo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - washgo-network

  # ==========================================================
  # Config Server
  # ==========================================================
  config-server:
    container_name: washgo-config-server
    build:
      context: ..
      dockerfile: config-server/Dockerfile

    restart: unless-stopped

    ports:
      - "8888:8888"

    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    networks:
      - washgo-network

  # ==========================================================
  # Eureka Server
  # ==========================================================
  discovery-server:
    container_name: washgo-discovery-server

    build:
      context: ..
      dockerfile: discovery-server/Dockerfile

    restart: unless-stopped

    depends_on:
      config-server:
        condition: service_healthy

    ports:
      - "8761:8761"

    networks:
      - washgo-network

  # ==========================================================
  # API Gateway
  # ==========================================================
  api-gateway:
    container_name: washgo-api-gateway

    build:
      context: ..
      dockerfile: api-gateway/Dockerfile

    restart: unless-stopped

    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    networks:
      - washgo-network

  # ==========================================================
  # Auth Service
  # ==========================================================
  auth-service:
    container_name: washgo-auth-service

    build:
      context: ..
      dockerfile: auth-service/Dockerfile

    restart: unless-stopped

    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

      discovery-server:
        condition: service_started

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/washgo_db
      SPRING_DATASOURCE_USERNAME: washgo
      SPRING_DATASOURCE_PASSWORD: root

    networks:
      - washgo-network

  # ==========================================================
  # Catalog Service
  # ==========================================================
  catalog-service:
    container_name: washgo-catalog-service

    build:
      context: ..
      dockerfile: catalog-service/Dockerfile

    restart: unless-stopped

    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/washgo_db
      SPRING_DATASOURCE_USERNAME: washgo
      SPRING_DATASOURCE_PASSWORD: root

    networks:
      - washgo-network

  # ==========================================================
  # Order Service
  # ==========================================================
  order-service:
    container_name: washgo-order-service

    build:
      context: ..
      dockerfile: order-service/Dockerfile

    restart: unless-stopped

    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started

    ports:
      - "8083:8083"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/washgo_db
      SPRING_DATASOURCE_USERNAME: washgo
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    networks:
      - washgo-network

  # ==========================================================
  # Payment Service
  # ==========================================================
  payment-service:
    container_name: washgo-payment-service

    build:
      context: ..
      dockerfile: payment-service/Dockerfile

    restart: unless-stopped

    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/washgo_db
      SPRING_DATASOURCE_USERNAME: washgo
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    networks:
      - washgo-network

  # ==========================================================
  # Logistics Service
  # ==========================================================
  logistics-service:
    container_name: washgo-logistics-service

    build:
      context: ..
      dockerfile: logistics-service/Dockerfile

    restart: unless-stopped

    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/washgo_db
      SPRING_DATASOURCE_USERNAME: washgo
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    networks:
      - washgo-network

  # ==========================================================
  # Notification Service
  # ==========================================================
  notification-service:
    container_name: washgo-notification-service

    build:
      context: ..
      dockerfile: notification-service/Dockerfile

    restart: unless-stopped

    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/washgo_db
      SPRING_DATASOURCE_USERNAME: washgo
      SPRING_DATASOURCE_PASSWORD: rnginxoot
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    networks:
      - washgo-network

  # ==========================================================
  # Nginx Reverse Proxy
  # ==========================================================
  nginx:
    image: nginx:1.28-alpine
    container_name: washgo-nginx

    restart: unless-stopped

    depends_on:
      - api-gateway

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

    networks:
      - washgo-network
