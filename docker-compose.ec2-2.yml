
services:

  payment-service:
    image: ghcr.io/prakashh45/payment-service:latest
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://172.31.42.90:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://172.31.42.90:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://172.31.42.90:5432/washgo_db
      SPRING_DATASOURCE_USERNAME: washgo
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 172.31.42.90:9092

  logistics-service:
    image: ghcr.io/prakashh45/logistics-service:latest
    container_name: logistics-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://172.31.42.90:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://172.31.42.90:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://172.31.42.90:5432/washgo_db
      SPRING_DATASOURCE_USERNAME: washgo
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 172.31.42.90:9092

  notification-service:
    image: ghcr.io/prakashh45/notification-service:latest
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://172.31.42.90:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://172.31.42.90:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://172.31.42.90:5432/washgo_db
      SPRING_DATASOURCE_USERNAME: washgo
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 172.31.42.90:9092

networks:
  default:
    name: washgo-network