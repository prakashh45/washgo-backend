name: WashGo Backend CI/CD

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: prakashh45

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Project
        run: ./gradlew clean build --no-daemon

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push Auth Service
        run: |
          docker build -t $REGISTRY/$IMAGE_OWNER/auth-service:latest ./auth-service
          docker push $REGISTRY/$IMAGE_OWNER/auth-service:latest

      - name: Build & Push Catalog Service
        run: |
          docker build -t $REGISTRY/$IMAGE_OWNER/catalog-service:latest ./catalog-service
          docker push $REGISTRY/$IMAGE_OWNER/catalog-service:latest

      - name: Build & Push Order Service
        run: |
          docker build -t $REGISTRY/$IMAGE_OWNER/order-service:latest ./order-service
          docker push $REGISTRY/$IMAGE_OWNER/order-service:latest

      - name: Build & Push Payment Service
        run: |
          docker build -t $REGISTRY/$IMAGE_OWNER/payment-service:latest ./payment-service
          docker push $REGISTRY/$IMAGE_OWNER/payment-service:latest

      - name: Build & Push Logistics Service
        run: |
          docker build -t $REGISTRY/$IMAGE_OWNER/logistics-service:latest ./logistics-service
          docker push $REGISTRY/$IMAGE_OWNER/logistics-service:latest

      - name: Build & Push Notification Service
        run: |
          docker build -t $REGISTRY/$IMAGE_OWNER/notification-service:latest ./notification-service
          docker push $REGISTRY/$IMAGE_OWNER/notification-service:latest

      - name: Build & Push API Gateway
        run: |
          docker build -t $REGISTRY/$IMAGE_OWNER/api-gateway:latest ./api-gateway
          docker push $REGISTRY/$IMAGE_OWNER/api-gateway:latest

      - name: Build & Push Discovery Server
        run: |
          docker build -t $REGISTRY/$IMAGE_OWNER/discovery-server:latest ./discovery-server
          docker push $REGISTRY/$IMAGE_OWNER/discovery-server:latest