plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.washgo'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.0.1")
    set('grpcVersion', "1.69.0")
}
dependencies {
    implementation project(":common")
}
dependencies {

    // Spring Cloud Gateway
    implementation('org.springframework.cloud:spring-cloud-starter-gateway-server-webflux') {
        exclude group: 'org.springframework.cloud', module: 'spring-cloud-gateway-server'
    }

    // Explicit WebFlux (required)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'


    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'


    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'


    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    // Firebase Admin SDK
    implementation 'com.google.firebase:firebase-admin:9.7.0'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // --- gRPC fix: required by Spring Cloud Gateway's GrpcSslConfigurer /
    // JsonToGRPCFilterFactory autoconfiguration, even when no gRPC routes are used ---
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        // Aligns all io.grpc:* transitive versions (e.g. pulled in by firebase-admin)
        // to the same version, preventing grpc-core/grpc-api version conflicts
        mavenBom "io.grpc:grpc-bom:${grpcVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}