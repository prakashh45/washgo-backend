# ======================================================
# APPLICATION
# ======================================================
spring.application.name=API-GATEWAY

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

washgo.gateway.secret=${WASHGO_GATEWAY_SECRET:default-gateway-secret-key-12345}
washgo.auth-service.url=http://localhost:8081

# ======================================================
# ACTUATOR
# ======================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ======================================================
# GATEWAY ROUTES
# ======================================================
logging.level.org.springframework.cloud.gateway=DEBUG

# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

# Catalog Service
spring.cloud.gateway.server.webflux.routes[1].id=catalog-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/catalog/**,/api/v1/catalog/**

# Order Service
spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/orders/**,/api/v1/cart/**

# Logistics Service - Delivery Partners
spring.cloud.gateway.server.webflux.routes[3].id=logistics-delivery-partners
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/delivery-partners/**

# Logistics Service - Assignments
spring.cloud.gateway.server.webflux.routes[4].id=logistics-assignments
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/assignments/**,/api/v1/logistics/**

# Payment Service
spring.cloud.gateway.server.webflux.routes[5].id=payment-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/payments/**

# Razorpay Service
spring.cloud.gateway.server.webflux.routes[6].id=razorpay-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/razorpay/**

# Notification Service
spring.cloud.gateway.server.webflux.routes[7].id=notification-service
spring.cloud.gateway.server.webflux.routes[7].uri=http://localhost:8086
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/v1/notifications/**
